<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Approval workflow · Prototype · Carbon Admin</title>
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/components.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-family-sans); color: var(--color-text-primary); background: var(--color-bg-1); -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    #root { height: 100%; }
    button { font-family: inherit; }
    a { color: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--color-text-tertiary); }

    /* ─── App shell ───────────────────────────────────────── */
    .app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
    .side { background: var(--color-bg-3); border-right: 1px solid var(--color-border-default); display: flex; flex-direction: column; }
    .side__brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
    .side__logo { width: 30px; height: 30px; border-radius: 7px; background: var(--color-primary-700); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -0.02em; flex: none; box-shadow: var(--shadow-cta); }
    .side__name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .side__name small { display: block; font-size: 11px; color: var(--color-text-tertiary); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
    .side__sectionlabel { padding: 14px 18px 6px; font-size: 11px; color: var(--color-text-tertiary); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .side__nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
    .side__item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--color-text-secondary); font-size: 13.5px; font-weight: 500; cursor: pointer; user-select: none; background: transparent; border: 0; width: 100%; text-align: left; }
    .side__item:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }
    .side__item.is-active { background: var(--color-bg-2); color: var(--color-text-primary); box-shadow: var(--shadow-1); }
    .side__item svg { color: var(--color-text-tertiary); flex: none; }
    .side__item.is-active svg { color: var(--color-primary-700); }
    .side__count { margin-left: auto; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--color-error-700); color: #fff; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
    .side__footer { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--color-border-subtle); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--color-text-secondary); }
    .side__avatar { width: 28px; height: 28px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
    .side__user-main { flex: 1; min-width: 0; }
    .side__user-name { font-size: 13px; font-weight: 600; color: var(--color-text-primary); letter-spacing: -0.005em; }
    .side__user-sub { font-size: 11.5px; color: var(--color-text-tertiary); }
    .side__user-switch { display: flex; align-items: center; padding: 0 4px; gap: 4px; font-size: 11.5px; color: var(--color-text-tertiary); cursor: pointer; }
    .side__user-switch select { border: 0; background: transparent; font: inherit; color: var(--color-primary-700); font-weight: 600; outline: 0; cursor: pointer; }

    /* ─── Main ────────────────────────────────────────────── */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; }
    .topbar { height: 56px; background: var(--color-bg-2); border-bottom: 1px solid var(--color-border-default); display: flex; align-items: center; padding: 0 24px; gap: 16px; flex: none; }
    .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-secondary); }
    .crumbs__sep { color: var(--color-text-tertiary); }
    .crumbs__current { color: var(--color-text-primary); font-weight: 500; }
    .crumbs a { color: inherit; text-decoration: none; cursor: pointer; }
    .crumbs a:hover { color: var(--color-text-primary); }
    .topbar__spacer { flex: 1; }
    .topbar__pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--color-text-secondary); padding: 6px 10px; border-radius: 999px; background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); }
    .content { flex: 1; overflow: auto; }
    .page { max-width: 1180px; margin: 0 auto; padding: 24px 32px 64px; }

    /* ─── Customer header ─────────────────────────────────── */
    .det-header { display: flex; align-items: flex-start; gap: 18px; padding: 22px 26px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); margin-bottom: 18px; }
    .det-header__logo { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #fff; letter-spacing: -0.02em; flex: none; background: linear-gradient(135deg, oklch(60% 0.14 240), oklch(38% 0.14 250)); }
    .det-header__main { flex: 1; min-width: 0; }
    .det-header__title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    .det-header__meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--color-text-secondary); margin-top: 4px; }
    .det-header__meta span { display: inline-flex; align-items: center; gap: 6px; }

    /* ─── Tabs ────────────────────────────────────────────── */
    .det-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border-default); margin-bottom: 20px; padding: 0 4px; }
    .det-tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 0; background: transparent; font: 500 13.5px var(--font-family-sans); color: var(--color-text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; }
    .det-tab:hover { color: var(--color-text-primary); }
    .det-tab.is-on { color: var(--color-text-primary); border-bottom-color: var(--color-primary-700); }
    .det-tab__count { background: var(--color-bg-3); border: 1px solid var(--color-border-subtle); color: var(--color-text-tertiary); font-size: 11px; padding: 1px 6px; border-radius: 10px; font-variant-numeric: tabular-nums; }
    .det-tab.is-on .det-tab__count { background: var(--color-primary-50); border-color: oklch(60% 0.14 262 / 0.25); color: var(--color-primary-700); }

    /* ─── Info card (identical to main app) ──────────────── */
    .info-card { background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; }
    .info-card + .info-card { margin-top: 16px; }
    .info-card__head { padding: 14px 20px; border-bottom: 1px solid var(--color-border-subtle); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .info-card__title { font-size: 14px; font-weight: 600; }
    .info-card__sub { font-size: 12.5px; color: var(--color-text-tertiary); margin-top: 2px; }

    /* ─── Table (identical) ──────────────────────────────── */
    .table-card .tds-table thead th:first-child { padding-left: 20px; }
    .table-card .tds-table tbody td:first-child { padding-left: 20px; }
    .table-card .tds-table thead th:last-child { padding-right: 20px; }
    .table-card .tds-table tbody td:last-child { padding-right: 20px; }
    .cust-cell { display: flex; align-items: center; gap: 10px; }
    .cust-name { font-weight: 500; color: var(--color-text-primary); }
    .cust-meta { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
    .op-mask { font-family: var(--font-family-mono); font-size: 12.5px; color: var(--color-text-primary); letter-spacing: 0.02em; }
    .reveal-btn { background: transparent; border: 0; color: var(--color-primary-500); font-size: 12px; font-weight: 500; cursor: pointer; padding: 0; margin-left: 8px; }
    .reveal-btn:hover { text-decoration: underline; }

    /* ─── Icon btn ──────────────────────────────────────── */
    .iconbtn { width: 28px; height: 28px; border-radius: 6px; display: inline-grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--color-text-tertiary); cursor: pointer; }
    .iconbtn:hover { background: var(--color-bg-hover); color: var(--color-text-primary); }

    /* ─── Operator action menu (identical to main app) ──── */
    .opmenu-wrap { position: relative; display: inline-block; }
    .opmenu { z-index: 90; min-width: 220px; background: var(--color-bg-2); border: 1px solid var(--color-border-default); border-radius: 8px; box-shadow: var(--shadow-4); padding: 4px; }
    .opmenu__item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 5px; font-size: 13px; color: var(--color-text-primary); cursor: pointer; background: transparent; border: 0; width: 100%; text-align: left; }
    .opmenu__item:hover { background: var(--color-bg-hover); }
    .opmenu__item--danger { color: var(--color-error-700); }
    .opmenu__item--danger:hover { background: var(--color-error-50); }
    .opmenu__item[disabled] { opacity: 0.45; cursor: not-allowed; }
    .opmenu__sep { height: 1px; background: var(--color-border-subtle); margin: 4px 2px; }
    .opmenu__item svg { color: var(--color-text-tertiary); flex: none; }
    .opmenu__item--danger svg { color: var(--color-error-500); }
    .opmenu__pendmark { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--color-warning-700); background: var(--color-warning-50); border: 1px solid oklch(75% 0.14 75 / 0.3); padding: 1px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* ─── Row-level pending marker chips ─────────────────── */
    .pendchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; font: 600 10.5px var(--font-family-sans); border: 1px solid transparent; cursor: pointer; line-height: 1.4; }
    .pendchip--warn { background: var(--color-warning-50); color: var(--color-warning-700); border-color: oklch(75% 0.14 75 / 0.3); }
    .pendchip--info { background: var(--color-info-50); color: var(--color-info-700); border-color: oklch(60% 0.14 230 / 0.3); }
    .pendchip--cancel { background: var(--color-bg-2); color: var(--color-text-secondary); border-color: var(--color-border-default); }
    .pendchip--cancel:hover { background: var(--color-error-50); color: var(--color-error-700); border-color: oklch(58% 0.20 25 / 0.3); }
    .pendchip:hover { filter: brightness(0.97); }

    /* ─── Notice banner ─────────────────────────────────── */
    .notice { display: flex; gap: 10px; padding: 10px 14px; background: var(--color-info-50); border: 1px solid oklch(60% 0.14 230 / 0.25); border-radius: 8px; font-size: 12.5px; color: var(--color-info-700); align-items: flex-start; margin-bottom: 16px; }
    .notice svg { flex: none; margin-top: 1px; }
    .notice strong { font-weight: 600; }

    /* ─── Diff box (used in modals & detail) ─────────────── */
    .diff { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; padding: 14px; background: var(--color-bg-3); border-radius: 8px; }
    .diff__col h5 { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; margin: 0 0 6px; }
    .diff__val { font-family: var(--font-family-mono); font-size: 13px; color: var(--color-text-primary); font-weight: 500; word-break: break-all; }
    .diff__col--old .diff__val { color: var(--color-text-tertiary); text-decoration: line-through; }
    .diff__col--new .diff__val { color: var(--color-success-700); }
    .diff__arrow { color: var(--color-text-tertiary); display: grid; place-items: center; }

    /* ─── Approval card list ─────────────────────────────── */
    .alist { display: flex; flex-direction: column; }
    .acard { display: grid; grid-template-columns: 32px 1fr auto; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--color-border-subtle); align-items: flex-start; }
    .acard:last-child { border-bottom: 0; }
    .acard__icon { width: 32px; height: 32px; border-radius: 8px; background: var(--color-bg-3); color: var(--color-text-secondary); display: grid; place-items: center; flex: none; }
    .acard__icon--warn { background: var(--color-warning-50); color: var(--color-warning-700); border: 1px solid oklch(75% 0.14 75 / 0.3); }
    .acard__icon--info { background: var(--color-info-50); color: var(--color-info-700); border: 1px solid oklch(60% 0.14 230 / 0.25); }
    .acard__icon--ok   { background: var(--color-success-50); color: var(--color-success-700); border: 1px solid oklch(58% 0.14 152 / 0.25); }
    .acard__icon--err  { background: var(--color-error-50); color: var(--color-error-700); border: 1px solid oklch(58% 0.20 25 / 0.25); }
    .acard__icon--neut { background: var(--color-bg-3); color: var(--color-text-tertiary); border: 1px solid var(--color-border-subtle); }
    .acard__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 600 11px var(--font-family-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-tertiary); }
    .acard__title { font-size: 13.5px; font-weight: 600; margin-top: 4px; line-height: 1.45; color: var(--color-text-primary); }
    .acard__meta { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--color-text-secondary); flex-wrap: wrap; }
    .acard__diff { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; margin-top: 8px; background: var(--color-bg-3); border-radius: 6px; font: 500 12.5px var(--font-family-mono); color: var(--color-text-primary); border: 1px solid var(--color-border-subtle); }
    .acard__diff .old { color: var(--color-text-tertiary); text-decoration: line-through; }
    .acard__diff svg { color: var(--color-text-tertiary); }
    .acard__actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    /* ─── Activity timeline (compact) ────────────────────── */
    .tl { list-style: none; margin: 0; padding: 0; position: relative; }
    .tl::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--color-border-subtle); }
    .tl__row { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 6px 0; align-items: flex-start; position: relative; }
    .tl__dot { width: 11px; height: 11px; border-radius: 50%; background: var(--color-bg-2); border: 2px solid var(--color-border-strong); margin-top: 4px; z-index: 1; }
    .tl__dot--ok   { border-color: var(--color-success-500); background: var(--color-success-500); }
    .tl__dot--warn { border-color: var(--color-warning-500); background: var(--color-warning-500); }
    .tl__dot--err  { border-color: var(--color-error-500); background: var(--color-error-500); }
    .tl__dot--info { border-color: var(--color-info-500); background: var(--color-info-500); }
    .tl__text { font-size: 12.5px; line-height: 1.5; color: var(--color-text-primary); }
    .tl__meta { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 1px; }

    /* ─── Empty state ────────────────────────────────────── */
    .empty { display: flex; flex-direction: column; align-items: center; padding: 36px 24px; text-align: center; color: var(--color-text-tertiary); }
    .empty svg { color: var(--color-text-tertiary); margin-bottom: 8px; }
    .empty__title { font-size: 13.5px; font-weight: 600; color: var(--color-text-secondary); }
    .empty__sub { font-size: 12.5px; margin-top: 4px; max-width: 320px; }

    /* ─── Modal extras ───────────────────────────────────── */
    .field-help { font-size: 12px; color: var(--color-text-tertiary); margin-top: 4px; }
    .field-error { font-size: 12px; color: var(--color-error-700); margin-top: 4px; display: flex; align-items: center; gap: 4px; }

    /* ─── Verify page (mock) ─────────────────────────────── */
    .vp { max-width: 460px; margin: 0 auto; padding: 20px 8px 8px; text-align: center; }
    .vp__logo { width: 44px; height: 44px; border-radius: 10px; background: var(--color-primary-700); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; margin: 0 auto 14px; }
    .vp h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
    .vp p { font-size: 13.5px; color: var(--color-text-secondary); margin: 0 0 16px; line-height: 1.6; }
    .vp__email { display: inline-block; padding: 6px 12px; border-radius: 6px; background: var(--color-bg-3); font-family: var(--font-family-mono); font-size: 13px; color: var(--color-text-primary); margin: 8px 0 14px; border: 1px solid var(--color-border-subtle); }
    .vp__from { font-size: 12px; color: var(--color-text-tertiary); margin-top: 4px; }

    /* ─── Notifications card ────────────────────────────── */
    .nlist { display: flex; flex-direction: column; }
    .notif { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--color-border-subtle); align-items: flex-start; }
    .notif:last-child { border-bottom: 0; }
    .notif__icon { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; }
    .notif__icon--email { background: var(--color-info-50); color: var(--color-info-700); border: 1px solid oklch(60% 0.14 230 / 0.25); }
    .notif__icon--inapp { background: var(--color-bg-3); color: var(--color-text-secondary); border: 1px solid var(--color-border-subtle); }
    .notif__head { font: 600 10.5px var(--font-family-sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .notif__head code { font: 500 11px var(--font-family-mono); color: var(--color-text-secondary); text-transform: none; letter-spacing: 0; }
    .notif__title { font-size: 13px; font-weight: 600; margin-top: 3px; line-height: 1.4; color: var(--color-text-primary); }
    .notif__body { font-size: 12.5px; color: var(--color-text-secondary); margin-top: 4px; line-height: 1.55; }
    .notif__time { font-size: 11.5px; color: var(--color-text-tertiary); white-space: nowrap; }
    .notif__cta { margin-top: 8px; }

    /* ─── Sub-tabs (Approvals) ───────────────────────────── */
    .subtabs { display: flex; gap: 4px; padding: 8px 20px 0; border-bottom: 1px solid var(--color-border-subtle); }
    .subtab { padding: 8px 12px 10px; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); border: 0; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px; }
    .subtab:hover { color: var(--color-text-primary); }
    .subtab.is-on { color: var(--color-text-primary); border-bottom-color: var(--color-primary-700); }
    .subtab .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--color-bg-3); color: var(--color-text-secondary); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid var(--color-border-subtle); }
    .subtab.is-on .count { background: var(--color-primary-50); border-color: oklch(60% 0.14 262 / 0.25); color: var(--color-primary-700); }

    /* ─── Toast ──────────────────────────────────────────── */
    .toast-host { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .toast { background: var(--color-text-primary); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px oklch(0% 0 0 / 0.2); max-width: 90vw; animation: tIn .18s ease; }
    @keyframes tIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* misc */
    .row { display: flex; align-items: center; gap: 8px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="approval-prototype.jsx"></script>
</body>
</html>
