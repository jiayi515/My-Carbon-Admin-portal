openapi: 3.1.1

info:
  title: Device Model API
  version: 1.0.0
  description: 设备型号管理接口

tags:
  - name: Device Model
    description: 设备型号管理

paths:

  /device-models:
    get:
      tags:
        - Device Model
      summary: 获取型号列表
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: modelName
          in: query
          schema:
            type: string
        - name: description
          in: query
          schema:
            type: string
        - name: family
          in: query
          schema:
            type: string
        - name: operatingSystem
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModelListResponse'
    post:
      tags:
        - Device Model
      summary: 创建型号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceModelRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModel'
        '409':
          description: 型号名称已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /device-models/summary:
    get:
      tags:
        - Device Model
      summary: 获取型号汇总信息
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: array
                description: 各操作系统对应的型号数量
                items:
                  $ref: '#/components/schemas/DeviceModelSummary'

  /device-models/export:
    get:
      tags:
        - Device Model
      summary: 导出型号列表
      parameters:
        - name: modelName
          in: query
          schema:
            type: string
        - name: description
          in: query
          schema:
            type: string
        - name: family
          in: query
          schema:
            type: string
        - name: operatingSystem
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 导出成功
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /device-models/{modelId}:
    get:
      tags:
        - Device Model
      summary: 获取型号详情
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModel'
        '404':
          description: 型号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Device Model
      summary: 修改型号
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceModelRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModel'
        '404':
          description: 型号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Device Model
      summary: 删除型号
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功
        '409':
          description: 存在归属设备或固件，禁止删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:

  schemas:

    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: 符合条件的总记录数

    Error:
      type: object
      properties:
        code:
          type: string
          description: 错误码，例如 VALIDATION / RESOURCE_CONFLICT / NOT_FOUND
        message:
          type: string

    CreateDeviceModelRequest:
      type: object
      required:
        - modelName
        - operatingSystem
        - orientation
        - family
        - mainScreenSize
        - mainResolution
      properties:
        modelName:
          type: string
          description: 型号名称
        family:
          type: string
          description: 型号系列（如 Smart POS / Mobile / Kiosk）
        description:
          type: string
          description: 型号描述信息
        operatingSystem:
          type: string
          description: 操作系统
        orientation:
          type: string
          description: 横竖屏信息
        mainScreenSize:
          type: string
          description: 主屏尺寸
        mainResolution:
          type: string
          description: 主屏分辨率
        subScreenSize:
          type: string
          description: 副屏尺寸
        subResolution:
          type: string
          description: 副屏分辨率
        logoUrl:
          type: string
          description: 型号 LOGO

    UpdateDeviceModelRequest:
      type: object
      properties:
        description:
          type: string
        orientation:
          type: string
        mainScreenSize:
          type: string
        mainResolution:
          type: string
        subScreenSize:
          type: string
        subResolution:
          type: string
        logoUrl:
          type: string

    DeviceModel:
      type: object
      properties:
        modelId:
          type: string
        modelName:
          type: string
        family:
          type: string
        description:
          type: string
        operatingSystem:
          type: string
          description: ANDROID / LINUX / RTOS
        orientation:
          type: string
          description: LANDSCAPE / PORTRAIT
        mainScreenSize:
          type: string
        mainResolution:
          type: string
        subScreenSize:
          type: string
        subResolution:
          type: string
        logoUrl:
          type: string
          description: 主图 URL；未上传时返回该操作系统的默认 LOGO

    DeviceModelListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceModel'
        pagination:
          $ref: '#/components/schemas/Pagination'

    DeviceModelSummary:
      type: object
      properties:
        operatingSystem:
          type: string
        count:
          type: integer
