  <style>
    html, body { margin: 0; height: 100%; background: var(--color-bg-1); overflow: hidden;
                 font-family: var(--font-family-sans); color: var(--color-text-primary);
                 -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    #root { height: 100%; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input, select, textarea { font: inherit; color: inherit; }
    .mono { font-family: var(--font-family-mono); font-variant-numeric: tabular-nums; font-feature-settings: "zero", "ss01"; }
    .num  { font-variant-numeric: tabular-nums; }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .carbon-root { height: 100%; width: 100%; display: flex; flex-direction: row; overflow: hidden;
                   font-size: 14px; line-height: 1.5; letter-spacing: -0.005em;
                   font-feature-settings: "ss01", "cv11"; }
    .carbon-root ::-webkit-scrollbar { width: 8px; height: 8px; }
    .carbon-root ::-webkit-scrollbar-thumb { background: var(--color-border-default); border-radius: 4px; }
    .carbon-root ::-webkit-scrollbar-track { background: transparent; }
    .carbon-root :focus-visible { outline: 2px solid var(--color-primary-500); outline-offset: 1px; border-radius: 4px; }
    /* Inputs handle their own focus ring via .tds-input:focus-within — don't double up */
    .carbon-root .tds-input__el:focus-visible,
    .carbon-root .tds-input:focus-within .tds-input__el { outline: none; }

    /* ─── Content widths ───────────────────────────────────────
       Top/bottom chrome and table screens are full-bleed.
       Two-column dashboards (overview, version detail) cap at 1280px.
       Forms (settings, narrow editors) cap at 720px. All centered. */
    .page-content        { max-width: 1280px; margin: 0 auto; width: 100%; }
    .page-content--narrow{ max-width: 720px;  margin: 0 auto; width: 100%; }
    /* Tables: full-width container, with a min-width on the table itself
       so the browser triggers horizontal scrolling on narrow viewports */
    .table-wrap          { width: 100%; overflow-x: auto; }
    .table-wrap > table  { min-width: 920px; }

    /* ─── Responsive layouts ──────────────────────────────────── */
    .app-overview { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
    .app-overview { max-width: 1280px; margin: 0 auto; width: 100%; }
    /* Device detail body — full-width, with cards in a 3-col → 2-col →
       1-col cascade that collapses gracefully on narrow viewports.
       Row-3 (Device + Deployment + Network) takes ~280px min per card;
       row-2 (System + Hardware posture) takes ~320px min per card. */
    .device-basic         { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .device-basic__row-3  { display: grid; gap: 14px;
                            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .device-basic__row-2  { display: grid; gap: 14px;
                            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .av-stats     { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .av-notes-grid{ display: grid; gap: 16px; }
    .av-notes-grid--split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    @media (max-width: 1100px) {
      .app-overview { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 760px) {
      .av-stats      { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .av-notes-grid--split { grid-template-columns: minmax(0, 1fr); }
    }

    /* ─── Sample-Activation animations ─────────────────────────── */
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes fade-in  { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes pop      { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes caret    { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .a-spin  { animation: spin 1s linear infinite; }
    .a-fade  { animation: fade-in 250ms var(--easing-standard) both; }
    .a-pop   { animation: pop 450ms cubic-bezier(.34,1.56,.64,1) both; }
    .a-caret { animation: caret 1s steps(1) infinite; }
  </style>
</head>
